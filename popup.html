<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>My Tracking List</title>
  <style>
    body {
      width: 340px;
      margin: 0;
      padding: 12px;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f9fafb;
      color: #1f2937;
    }
    h2 {
      font-size: 16px;
      margin-top: 0;
      margin-bottom: 10px;
      border-bottom: 2px solid #e5e7eb;
      padding-bottom: 6px;
    }
    #product-list {
      max-height: 400px;
      overflow-y: auto;
    }
    .product-card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .product-url {
      font-size: 12px;
      color: #2563eb;
      text-decoration: none;
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 6px;
    }
    .product-url:hover {
      text-decoration: underline;
    }
    .price-info {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .history-toggle {
      background: none;
      border: none;
      color: #4b5563;
      font-size: 11px;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
    }
    .history-list {
      display: none;
      margin-top: 6px;
      padding-left: 14px;
      font-size: 11px;
      color: #6b7280;
      border-left: 2px solid #e5e7eb;
    }
    .empty-state {
      text-align: center;
      color: #6b7280;
      font-size: 13px;
      padding: 20px 0;
    }
  </style>
</head>
<body>
  <h2>📦 Productos en la mira</h2>
  <div id="product-list">
    <div class="empty-state">Cargando productos...</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
